<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><title>Job Hunter is offline</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f5f7;--text:#1d1d1f;--sub:#6e6e73;--blue:#0071e3}
  @media(prefers-color-scheme:dark){:root{--bg:#000;--text:#f5f5f7;--sub:#a1a1a6;--blue:#0a84ff}}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
  .mark{width:72px;height:72px;border-radius:21px;margin:0 auto 20px;background:linear-gradient(145deg,#3ea0ff,#5e5ce6);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(94,92,230,.35)}
  h1{font-size:26px;letter-spacing:-.03em;margin:0 0 8px}p{color:var(--sub);max-width:340px;margin:0 auto 22px;line-height:1.5}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;height:46px;padding:0 26px;background:var(--blue);color:#fff;cursor:pointer}
</style></head><body><main>
<div class="mark"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.8 4.8"/><path d="m7.9 10.6 1.9 1.9 3.4-3.7"/></svg></div>
<h1>Your Mac isn&rsquo;t reachable</h1>
<p>Job Hunter runs on your Mac, so it&rsquo;s unavailable while the Mac is asleep, shut down, or you&rsquo;re off your private network. Nothing is lost: everything is stored on the Mac.</p>
<button onclick="location.reload()">Try again</button>
</main></body></html>
