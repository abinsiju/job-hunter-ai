<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 14px -apple-system, system-ui, sans-serif; width: 340px; margin: 14px; color: #1d1d1f; }
  h1 { font-size: 16px; margin: 0 0 6px; } p { margin: 6px 0; color: #555; } input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0; }
  button { width: 100%; padding: 10px; font-weight: 600; border: 0; border-radius: 8px; background: #0a84ff; color: #fff; cursor: pointer; } #out { margin-top: 10px; white-space: pre-wrap; }
  .small { font-size: 12px; }
</style></head><body>
  <h1>Job Hunter Autofill</h1>
  <p class="small">Paste the code from Job Hunter (valid 30 minutes), open the employer's application page, then press Fill.</p>
  <input id="code" placeholder="jh1:8000:…" autocomplete="off" spellcheck="false">
  <button id="fill">Fill this page</button>
  <p class="small">It only fills fields and attaches your documents. It never presses Submit, never solves a security check and never signs in.</p>
  <div id="out"></div>
  <script src="popup.js"></script>
</body></html>
